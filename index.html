<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birb OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="cat.css">
    <link rel="stylesheet" href="cursor.css">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="extracted.css">
</head>
<body class="dark-mode">
    <div class="blob-layer" aria-hidden="true"></div>
    <canvas id="canvas"></canvas>

    <div class="login-overlay active" id="login-overlay" aria-hidden="false">
        <div class="frosted-glass login-card">
            <div class="login-avatar">
                <img src="birb1.png" alt="Birb">
            </div>
            <h2 class="login-title">Birb OS Login</h2>
            <form class="login-form" id="login-form">
                <div class="login-field-group">
                    <label class="login-field-label" for="login-username">Username</label>
                    <input id="login-username" class="login-field" type="text" placeholder="Enter username" autocomplete="username">
                </div>
                <div class="login-field-group">
                    <label class="login-field-label" for="login-password">Password</label>
                    <input id="login-password" class="login-field" type="password" placeholder="Enter password" autocomplete="current-password">
                </div>
                <p class="login-error" id="login-error" aria-live="polite"></p>
                <button class="copy login-submit" type="submit">Log in</button>
            </form>
        </div>
    </div>

    <div id="viewport"></div>

    <!--templates for dynamic.js-->
    <div id="templates">
        <template id="t-welcome" class="dragable hidden">
            <h1>Welcome to Birb OS!</h1>
            <p>This is a bird themed web-os with tools:</p>
            <ul>
                <li>text editor</li>
                <li>code editor</li>
            </ul>
        </template>

        <template id="t-txtEditor" class="dragable hidden">
            <textarea class="txt-editor-area" placeholder="Start typing your notes here..."></textarea>
        </template>

        <template id="t-codeEditor" class="dragable hidden">
            <textarea spellcheck="false" class="code-editor-area">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
</head>
<body>

</body>
</html>
</textarea>
        </template>
    
        <template id="t-settings" class="dragable hidden">
            <h1>Settings: </h1>
            <div class="spacer"></div>
            <div class="fav-color-container">
                <span class="color-text">color theme: </span>
                <input id="colorPicker" class="copy" type="color" value="#976fb6ff">
            </div>
            <div class="fav-color-container">
                <span class="color-text">Bird counter: </span>
                <input id="bird-count" class="copy pointer" type="number" value="1" min="1">
                <button class="copy" data-action="addBird">+</button>
                <button class="copy" data-action="removeBird">-</button>
            </div>
            <div class="fav-color-container">
                <span class="color-text">Bird colors: </span>
                <input id="bird-color-count" class="copy pointer" type="number" value="3" min="1" max="8">
                <button class="copy" data-action="addBirdColor">+</button>
                <button class="copy" data-action="removeBirdColor">-</button>
            </div>
            <div class="fav-color-container">
                <span class="color-text">Contrast Theme: </span>
                <button class="copy" data-action="toggleCT" id="CT-btn">Dark</button>
            </div>
            <br>
            <div class="fav-color-container" id="bird-colors-container">
                <span class="color-text">Bird color list: </span>
            </div>
            <div class="fav-color-container bg-selection-container">
                <span class="color-text"><i class="fa-solid fa-images"></i> BG selection: </span>
                <div class="explorer-container">
                    <div id="explorer-header" class="explorer-header"></div>
                    <div id="explorer-body" class="explorer-body"></div>
                </div>
            </div>
            <!--settings-note-->
            <div class="fav-color-container">
                <button class="copy" data-action="ShowHome">Back to main</button>
                <button class="copy" data-action="HideMsg">Hide msg</button>
            </div>
        </template>

        <template id="t-mail" class="dragable hidden">
            <p class="mail-to-text">To: reimacdougall@gmail.com</p>
            
            <input type="text" id="mail-subject" placeholder="Subject (e.g., Job Opportunity)" value="Interested in your work!" class="mail-input">
            
            <textarea id="mail-body" placeholder="Write your message here..." class="mail-textarea"></textarea>
            
            <button onclick="sendEmailViaMailto()" class="copy pointer send-email-btn">
                Send Email <i class="fa-solid fa-paper-plane"></i>
            </button>
        </template>

        <template id="t-calculator" class="dragable hidden">
            <div id="calc-display" class="calc-display-area">0</div>
            
            <div id="calculator-buttons" class="calc-grid calc-button-grid">
                <button type="button" class="Calc-btn" data-value="AC">AC</button>
                <button type="button" class="Calc-btn" data-value="%">%</button>
                <button type="button" class="Calc-btn" data-value="/">/</button>
                <button type="button" class="Calc-btn" data-value="*">*</button>
                
                <button type="button" class="Calc-btn" data-value="7">7</button>
                <button type="button" class="Calc-btn" data-value="8">8</button>
                <button type="button" class="Calc-btn" data-value="9">9</button>
                <button type="button" class="Calc-btn" data-value="-">-</button>
                
                <button type="button" class="Calc-btn" data-value="4">4</button>
                <button type="button" class="Calc-btn" data-value="5">5</button>
                <button type="button" class="Calc-btn" data-value="6">6</button>
                <button type="button" class="Calc-btn" data-value="+">+</button>
                
                <button type="button" class="Calc-btn" data-value="1">1</button>
                <button type="button" class="Calc-btn" data-value="2">2</button>
                <button type="button" class="Calc-btn" data-value="3">3</button>
                <button type="button" class="Calc-btn calc-btn-tall" data-value="=">=</button>
                
                <button type="button" class="Calc-btn calc-btn-wide" data-value="0">0</button>
                <button type="button" class="Calc-btn" data-value=".">.</button>
            </div>
        </template>

        <template id="t-browser" class="dragable hidden">
            <input id="searchbar" type="text" value="home.html">
            <div id="bookmark-bar">
                <button class="bookmark" onclick="visitSite('home.html')">Home</button>
                <button class="bookmark" onclick="visitSite('https://startmyeducation.net/signin.html')">Games</button>
                <button class="bookmark" onclick="visitSite('https://excalidraw.com/')">Exacalidraw</button>
                <button class="bookmark" onclick="visitSite('https://www.desmos.com/')">Desmos</button>
                <button class="bookmark" onclick="visitSite('https://animejs.com/easing-editor/spring/default')">AnimeJs</button>
                <button class="bookmark" onclick="visitSite('https://reactbits.dev/')">React bits</button>
                <button class="bookmark" onclick="visitSite('https://glacierarcade.win/')">Arcade</button>
            </div>
            <iframe id="searchwindow" src="home.html" height="1000"></iframe>
        </template>

        <template id="t-addApp" class="dragable hidden">
            <input type="text" id="customAppName" placeholder="App Name (optional)">
            <input type="text" id="customAppIcon" placeholder="fa icon  (optional)">
            <input type="file" id="appUpload" accept=".html"/>
        </template>

        <template id="t-clock">
            <div id="clock-bg">
                <div id="clock-time" class="clock-time hidden">
                    <button class="clock-btn">edit</button>
                    <button class="clock-btn">+</button>
                    <h1 class="centered">World clock: </h1>
                    <div id="Times">
                        <p id="t-GMT-5">GMT-5: 0:00:00 am</p>
                    </div>
                </div>
                <div id="clock-alarms" class="clock-alarms  hidden">
                    <button class="clock-btn">edit</button>
                    <button class="clock-btn">+</button>
                    <h1 class="centered">Alarms: </h1>
                    <div id="Alarm-list"></div>
                </div>
                <div id="clock-stopwatch" class="clock-stopwatch  hidden">
                    <h1 class="centered">Stop watch: </h1>
                    <div id="stopwatch-circle"></div>
                    <p id="stopwatch-time"></p>
                    <button class="clock-btn">Lap</button>
                    <button class="clock-btn">Start</button>
                    <div id="lap-list"></div>
                </div>
                <div id="clock-timer" class="clock-timer">
                    <div class="timer-left">
                        <h1 class="centered">Timer:</h1>
                        <div id="clock-circle" class="centered">
                            <p id="time-ring" class="centered">0:00 pm</p>
                            <p id="time-left" class="Tvalue centered">00:00:00</p>
                            <p id="time-loops" class="Tvalue centered">0</p>
                        </div>
                    </div>
                    
                    <div class="timer-right">
                        <div id="select-timer">
                            <input class="clock-btn centered" type="number" value="0" id="time-h">
                            <input class="clock-btn centered" type="number" value="0" id="time-m">
                            <input class="clock-btn centered" type="number" value="0" id="time-s">
                        </div>
                        <button class="clock-btn" onclick="cancelTimer()">cancel</button>
                        <button class="clock-btn" onclick="createNewTimer()">Start</button>
                    </div>

                    <div class="timmer-bottom">
                        <label class="clock-btn"><input type="checkbox" id="countdown" style="display: none;" checked="true">countdown</label>
                        <label class="clock-btn"><input type="checkbox" id="loop" style="display: none;">loop</label>
                        <label class="clock-btn">
                            <input type="checkbox" id="pause-resume" style="display: none;" onclick="togglePause()">
                            <span id="pause-text">pause</span>
                        </label>
                        <select name="ring sound" id="ring" class="clock-btn">
                            <option value="none">none</option>
                            <option value="alert">notification</option>
                            <option value="alarm1">ding</option>
                            <option value="alarm2">drums</option>
                            <option value="alarm3">harmony</option>
                            <option value="alarm4">louder ding</option>
                        </select>
                        <select name="rnning-timers" id="r-timmers" class="clock-btn"  onchange="switchMainTimer()">
                            <option value="none" disabled selected>No active timers</option>
                        </select>
                    </div>
                </div>

                <br>
                
                <button class="clock-btn" onclick='clockPage("time")'>Time</button>
                <button class="clock-btn" onclick='clockPage("alarms")'>Alarms</button>
                <button class="clock-btn" onclick='clockPage("stopwatch")'>Stopwatch</button>
                <button class="clock-btn" onclick='clockPage("timer")'>Timer</button>
            </div>
        </template>
    </div>
    
    <div class="fav-color-container os-shell">
        <div class="os-header">
            <span class="os-title">Birb OS</span>
            <span class="os-time" id="timeElement">Time: </span>
        </div>
    

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="imageTree.js"></script>
    <script src="dynamic.js"></script>
    <script type="module" src="core.js"></script>
</body>
</html>
