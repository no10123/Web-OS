<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birb OS</title>
    <link rel="stylesheet" href="cat.css">
    <link rel="stylesheet" href="cursor.css">
    <link rel="stylesheet" href="https://no10123.github.io/website/style.css">
</head>
<body>
    <div class="blob-layer" aria-hidden="true"></div>
    <canvas id="canvas"></canvas>

    <div class="login-overlay active" id="login-overlay" aria-hidden="false">
        <div class="frosted-glass login-card">
            <div class="login-avatar">
                <img src="birb1.png" alt="Birb">
            </div>
            <h2 class="login-title">Birb OS Login</h2>
            <form class="login-form" id="login-form">
                <div class="login-field-group">
                    <label class="login-field-label" for="login-username">Username</label>
                    <input id="login-username" class="login-field" type="text" placeholder="Enter username" autocomplete="username">
                </div>
                <div class="login-field-group">
                    <label class="login-field-label" for="login-password">Password</label>
                    <input id="login-password" class="login-field" type="password" placeholder="Enter password" autocomplete="current-password">
                </div>
                <p class="login-error" id="login-error" aria-live="polite"></p>
                <button class="copy login-submit" type="submit">Log in</button>
            </form>
        </div>
    </div>

    <div id="veiwport">
        <div class="apps-panel" id="apps">
            <button class="app-launcher" type="button" onclick="openWelcomeWindow()">
                <img src="txt.png" alt="TxT">
                <span>welcome msg</span>
            </button>
            <button class="app-launcher" type="button" onclick="openWelcomeWindow()">
                <img src="txt.png" alt="TxT">
                <span>txt editor</span>
            </button>
            <button class="app-launcher" type="button" onclick="openWelcomeWindow()">
                <img src="txt.png" alt="TxT">
                <span>code editor</span>
            </button>
            <button class="app-launcher" type="button">
                <span class="app-plus" aria-hidden="true">+</span>
                <span>add app</span>
            </button>
            <button class="app-launcher" type="button" onclick="openSettingsWindow()">
                <span class="app-plus" aria-hidden="true">*</span>
                <span>settings</span>
            </button>
        </div>

        <div id="windows">
            <div id="welcome-msg" class="dragable hidden">
                <div class="drag" id="welcome-msgheader">
                    <img src="txt.png" alt="TxT">
                    <span class="wTitle">Welcome msg</span>
                    <div class="window-controls">
                        <button type="button">-</button>
                        <button type="button" onclick="toggleWelcomeFullscreen()">[]</button>
                        <button type="button" onclick="closeWelcomeWindow()">x</button>
                    </div>
                </div>
                <div class="text frosted-glass">
                    <h1>Welcome to Birb OS!</h1>
                    <p>This is a bird themed web-os with tools:</p>
                    <ul>
                        <li>text editor</li>
                    </ul>
                </div>
            </div>
            <div id="settings" class="dragable hidden">
                <div class="drag" id="settingsheader">
                    <img src="txt.png" alt="TxT">
                    <span class="wTitle">Settings</span>
                    <div class="window-controls">
                        <button type="button" onclick="minimizeSettingsWindow()">-</button>
                        <button type="button" onclick="toggleSettingsFullscreen()">[]</button>
                        <button type="button" onclick="closeSettingsWindow()">x</button>
                    </div>
                </div>
                <div class="text frosted-glass">
                    <h1>Settings:</h1>
                    <div class="fav-color-container">
                        <span class="color-text">color theme: </span>
                        <input id="colorPicker" class="copy" type="color" value="#976fb6">
                    </div>
                    <div class="fav-color-container">
                        <span class="color-text">Bird counter: </span>
                        <input id="bird-count" class="copy pointer" type="number" value="75" min="0">
                        <button class="copy" onclick="clickButton(7)">+</button>
                        <button class="copy" onclick="clickButton(8)">-</button>
                    </div>
                    <div class="fav-color-container">
                        <span class="color-text">Bird colors: </span>
                        <input id="bird-color-count" class="copy pointer" type="number" value="3" min="1" max="8">
                        <button class="copy" onclick="clickButton(11)">+</button>
                        <button class="copy" onclick="clickButton(12)">-</button>
                    </div>
                    <br>
                    <div class="fav-color-container" id="bird-colors-container">
                        <span class="color-text">Bird color list: </span>
                    </div>
                    <p class="settings-note">Tip: the color picker updates the background glow and glass panel instantly.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="fav-color-container os-shell">
        <div class="os-header">
            <span class="os-title">Birb OS</span>
            <span class="os-time" id="timeElement">Time: </span>
        </div>
    </div>

    <script src="core.js"></script>
</body>
</html>
