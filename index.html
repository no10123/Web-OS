<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birb OS</title>
    <link rel="stylesheet" href="cat.css">
    <link rel="stylesheet" href="cursor.css">
    <style>
        body {
            position: relative;
            background-color: var(--base);
            font-family: Arial, sans-serif;
            cursor: url('cursor.cur'), auto;
            overflow: hidden;
            margin: 0;
            padding: 0;
            min-width: 100vw;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .blob-layer {
            /*from - https://backseasy.com/nebula-effect*/
            position: fixed;
            inset: 0;
            z-index: 0;
            background: radial-gradient(circle at 30% 30%, rgba(43,26,77,0.95), rgba(57,25,55,0.75));
            filter: blur(40px);
            opacity: 0.9;
            border-radius: 30% 70% 70% 30%/30% 30% 70% 70%;
            pointer-events: none;
            transform: translateZ(0);
            will-change: filter, opacity, transform;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .frosted-glass {
            /*from - https://backseasy.com/nebula-effect*/
            position: relative;
            z-index: 2;
            box-sizing: border-box;
            backdrop-filter: blur(10px) saturate(130%);
            -webkit-backdrop-filter: blur(10px) saturate(130%);
            background-color: rgba(151, 111, 182, 0.349);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.22);
            padding: 13px;
            max-width: 200vh;
            margin: 15px;
            background-image: linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.03));
            background-size: cover;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .os-shell {
            padding: 13px 13px 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .os-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .os-title {
            color: var(--text);
            font-size: 20px;
            font-weight: 700;
            line-height: 1.2;
        }

        .os-time {
            margin-left: auto;
            text-align: right;
            color: var(--subtext1);
            font-size: 14px;
            line-height: 1.3;
            white-space: nowrap;
        }

        .os-shell .fav-color-container:last-child {
            margin-bottom: 0;
        }

        #veiwport {
            position: fixed;
            left: 0;
            right: 0;
            top: 92px;
            bottom: 0;
            z-index: 2;
        }

        #windows {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .apps-panel {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            margin: 0 15px 15px;
            padding: 0 13px 13px;
        }

        .app-launcher {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            width: 72px;
            color: var(--text);
            background: transparent;
            border: 0;
            padding: 0;
            margin: 0;
        }

        .app-launcher img,
        .app-launcher .app-plus {
            width: 28px;
            height: 28px;
            display: block;
        }

        .app-launcher .app-plus {
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: rgba(53, 59, 103, 0.9);
            font-size: 22px;
            line-height: 1;
            font-weight: 700;
        }

        .app-launcher span {
            font-size: 13px;
            line-height: 1.2;
            text-align: center;
            text-transform: lowercase;
        }

        .dragable {
            position: absolute;
            z-index: 9;
            width: min(700px, calc(100vw - 30px));
            box-sizing: border-box;
            pointer-events: auto;
        }

        .drag {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: #1d2033;
            color: var(--text);
            border-radius: 18px 18px 0 0;
            user-select: none;
            cursor: move;
        }

        .drag img {
            width: 20px;
            height: 20px;
            object-fit: contain;
            display: block;
        }

        .wTitle {
            flex: 1 1 auto;
            font-size: 14px;
            font-weight: 700;
        }

        .window-controls {
            display: flex;
            gap: 6px;
        }

        .window-controls button {
            width: 24px;
            height: 24px;
            padding: 0;
            margin: 0;
            border-radius: 7px;
            background: rgba(53, 59, 103, 0.95);
            color: var(--text);
            border: none;
            line-height: 1;
        }

        #welcome-msg {
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        #welcome-msg.fullscreen {
            left: 0 !important;
            top: 0 !important;
            width: 100% !important;
            height: 100% !important;
            transform: none !important;
            margin: 0;
        }

        #welcome-msg.fullscreen .text {
            width: 100%;
            height: calc(100% - 52px);
            overflow: auto;
            border-radius: 0 0 28px 28px;
        }

        canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        h1,
        p,
        ul,
        .fav-color-container,
        .coppy {
            position: relative;
            z-index: 2;
        }

        h1 {
            color: var(--text);
            margin-top: 24px;
            margin-left: 24px;
            font-size: 48px;
        }

        p {
            color: var(--subtext1);
            font-size: 18px;
            margin: 0 0 12px 0;
            padding-left: 24px;
        }

        ul {
            list-style-type: square;
            color: var(--subtext1);
            margin: 0 0 24px 0;
            padding-left: 44px;
        }

        .fav-color-container {
            display: inline-flex;
            align-items: center;
            background-color: #25283f;
            padding: 6px 10px;
            border-radius: 4px;
            font-family: 'Courier New', Courier, monospace;
            color: #cad3f5;
            margin: 0 0 24px 24px;
        }

        .color-box {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 8px;
            border: 1px solid #ffffff;
        }

        .copy {
            color: var(--text);
            background-color: #353b67;
            border-radius: 4px;
            border: none;
            padding: 4px 8px;
            margin-left: 10px;
        }

        button:hover {
            cursor: pointer;
        }

        .pointer:hover {
            cursor: pointer;
        }

        a {
            color: var(--text);
        }
        a:hover {
            color: var(--subtext1);
            text-decoration: underline;
        }

        /* Link after being visited */
        a:visited {
            color: var(--base);
        }

        #msg {
            opacity: 1;
            transition: opacity 0.35s ease;
        }
        #msg.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .settings-note {
            color: var(--subtext1);
            font-size: 14px;
            margin: 0 0 12px 24px;
        }

        .login-overlay {
            position: fixed;
            inset: 0;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: rgba(9, 10, 24, 0.28);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .login-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .login-card {
            width: min(92vw, 420px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            text-align: center;
        }

        .login-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.05);
            flex: 0 0 auto;
        }

        .login-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .login-title {
            color: var(--text);
            margin: 0;
            font-size: 28px;
        }

        .login-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .login-field-group {
            text-align: left;
        }

        .login-field-label {
            display: block;
            color: var(--subtext1);
            font-size: 14px;
            margin: 0 0 8px 2px;
        }

        .login-field {
            width: 100%;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            font-size: 16px;
            padding: 10px 2px 12px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, #a6e3a1 0%, #89b4fa 100%) 1;
        }

        .login-field::placeholder {
            color: rgba(202, 211, 245, 0.55);
        }

        .login-field:focus {
            border-image: linear-gradient(90deg, #f5c2e7 0%, #a6e3a1 100%) 1;
        }

        .login-error {
            min-height: 1.2em;
            margin: 0;
            color: #f38ba8;
            font-size: 14px;
        }

        .login-submit {
            width: 100%;
            margin-left: 0;
            margin-top: 4px;
        }

        .circle {
            border-radius: 50%;
        }

        .login-note {
            margin: 0;
            color: var(--subtext1);
            font-size: 14px;
            line-height: 1.5;
        }
        #welcome-msg {
            opacity: 1;
            transition: opacity 0.35s ease;
        }
        #welcome-msg.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="blob-layer" aria-hidden="true"></div>
    <canvas id="canvas"></canvas>

    <div class="login-overlay active" id="login-overlay" aria-hidden="false">
        <div class="frosted-glass login-card">
            <div class="login-avatar">
                <img src="birb1.png" alt="Birb">
            </div>
            <h2 class="login-title">Birb OS Login</h2>
            <form class="login-form" id="login-form">
                <div class="login-field-group">
                    <label class="login-field-label" for="login-username">Username</label>
                    <input id="login-username" class="login-field" type="text" placeholder="Enter username" autocomplete="username">
                </div>
                <div class="login-field-group">
                    <label class="login-field-label" for="login-password">Password</label>
                    <input id="login-password" class="login-field" type="password" placeholder="Enter password" autocomplete="current-password">
                </div>
                <p class="login-error" id="login-error" aria-live="polite"></p>
                <button class="copy login-submit" type="submit">Log in</button>
            </form>
        </div>
    </div>

    <div class="frosted-glass os-shell">
        <div class="os-header">
            <span class="os-title">Birb OS</span>
            <span class="os-time" id="timeElement">Time: </span>
        </div>
    </div>

    <div id="veiwport">
        <div class="apps-panel" id="apps">
            <button class="app-launcher" type="button" onclick="openWelcomeWindow()">
                <img src="txt.png" alt="TxT">
                <span>welcome msg</span>
            </button>
            <button class="app-launcher" type="button">
                <span class="app-plus" aria-hidden="true">+</span>
                <span>add app</span>
            </button>
            <button class="app-launcher" type="button">
                <span class="app-plus" aria-hidden="true">*</span>
                <span>settings</span>
            </button>
        </div>

        <div id="windows">
            <div id="welcome-msg" class="dragable hidden">
                <div class="drag" id="welcome-msgheader">
                    <img src="txt.png" alt="TxT">
                    <span class="wTitle">Welcome msg</span>
                    <div class="window-controls">
                        <button type="button">-</button>
                        <button type="button" onclick="toggleWelcomeFullscreen()">[]</button>
                        <button type="button" onclick="closeWelcomeWindow()">x</button>
                    </div>
                </div>
                <div class="text frosted-glass">
                    <h1>Welcome to Birb OS!</h1>
                    <p>This is a bird themed web-os with tools:</p>
                    <ul>
                        <li>text editor</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loginBypass = new URLSearchParams(window.location.search).get('login') === 'true';
        const loginOverlay = document.getElementById('login-overlay');
        const loginForm = document.getElementById('login-form');
        const loginUsername = document.getElementById('login-username');
        const loginPassword = document.getElementById('login-password');
        const loginError = document.getElementById('login-error');
        const osTarget = '../../Web-OS/index.html?login=true';
        const veiwport = document.getElementById("veiwport");
        const apps = document.getElementById("apps");
        const wm = document.getElementById("welcome-msg")
        const wmHeader = document.getElementById('welcome-msgheader');
        const timeText = document.getElementById("timeElement");
        let currentTime = new Date().toLocaleString();
        timeText.textContent = `Time: ${currentTime}`
        function updateTime() {
            currentTime = new Date().toLocaleString();
            timeText.textContent = `Time: ${currentTime}`
        };
        setInterval(updateTime, 1000);

        let width;
        let height;
        let mouseX = -1000;
        let mouseY = -1000;
        let isMouseDown = false;
        let birds = [];
        let welcomeIsFullscreen = false;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (!wm.classList.contains('hidden') && !welcomeIsFullscreen) {
                centerWelcomeWindow();
            }
        }

        function getWelcomeWindowBounds() {
            const viewportRect = veiwport.getBoundingClientRect();
            const windowRect = wm.getBoundingClientRect();
            return {
                left: Math.max(15, Math.round((viewportRect.width - windowRect.width) / 2)),
                top: Math.max(15, Math.round((viewportRect.height - windowRect.height) / 2)),
            };
        }

        function centerWelcomeWindow() {
            const bounds = getWelcomeWindowBounds();
            wm.style.left = `${bounds.left}px`;
            wm.style.top = `${bounds.top}px`;
            wm.style.transform = 'none';
        }

        function openWelcomeWindow() {
            wm.classList.remove('hidden');
            welcomeIsFullscreen = false;
            wm.classList.remove('fullscreen');
            wm.style.width = '';
            wm.style.height = '';
            centerWelcomeWindow();
        }

        function closeWelcomeWindow() {
            wm.classList.add('hidden');
            welcomeIsFullscreen = false;
            wm.classList.remove('fullscreen');
        }

        function toggleWelcomeFullscreen() {
            if (wm.classList.contains('hidden')) return;

            welcomeIsFullscreen = !welcomeIsFullscreen;
            wm.classList.toggle('fullscreen', welcomeIsFullscreen);

            if (welcomeIsFullscreen) {
                wm.style.left = '0px';
                wm.style.top = '0px';
                wm.style.width = '100%';
                wm.style.height = '100%';
            } else {
                wm.style.width = '';
                wm.style.height = '';
                centerWelcomeWindow();
            }
        }

        //from w3 schools (slightly edited)
        function dragElement(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            const header = document.getElementById(elmnt.id + 'header');
            const dragHandle = header || elmnt;

            dragHandle.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                if (elmnt.classList.contains('fullscreen')) {
                    return;
                }

                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + 'px';
                elmnt.style.left = (elmnt.offsetLeft - pos1) + 'px';
                elmnt.style.transform = 'none';
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        async function clickButton(i) {
            if (i==1) {
                await navigator.clipboard.writeText("#a6e3a1")
                //alert("copeid!")
            } else if (i == 2) {
                mb = (mb % maxM) + 1;
                MB.textContent = mb;
            } else if (i == 3) {
                mb = Math.ceil(Math.random() * maxM);
                MB.textContent = mb;
            } else if (i == 7) {
                birdCount += 1;
                birds.push(new Bird());
                birdCounter.value = String(birdCount);
            } else if (i == 8) {
                if (birds.length > 0) {
                    birds.pop();
                    birdCount = Math.max(0, birdCount - 1);
                    birdCounter.value = String(birdCount);
                }
            } else if (i == 11) {
                setBirdColorCount(Math.min(birdColors.length + 1,8));
            } else if (i == 12) {
                setBirdColorCount(Math.max(birdColors.length - 1,0));
            }
        }

        function showLoginError(message) {
            loginError.textContent = message;
        }

        function hideLogin() {
            loginOverlay.classList.remove('active');
            loginOverlay.setAttribute('aria-hidden', 'true');
            loginError.textContent = '';
            loginForm.reset();
        }

        if (loginBypass) {
            hideLogin();
            loginOverlay.classList.remove('active');
            loginOverlay.setAttribute('aria-hidden', 'true');
        }

        window.addEventListener('mousemove', (event) => {
            mouseX = event.clientX;
            mouseY = event.clientY;
        });

        window.addEventListener('mousedown', () => isMouseDown = true);
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('resize', resize);

        resize();

        function getCy(x, y) {
            const time = Date.now() * 0.0015;
            return Math.sin(time * 0.02) * 2 + Math.sin((x + y) * 0.002) * 0.75;
        }

        function getCx(x, y) {
            const time = Date.now() * 0.0015;
            return Math.cos(time * 0.02) * 2 + Math.sin((x - y) * 0.002) * 0.75;
        }

        class Bird {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() * 1.5) + 1;
                this.vy = (Math.random() - 0.5) * 1;
                this.Vx = this.vx;
                this.Vy = this.vy;
                this.color = ['#b4befe', '#cba6f7', '#cdd6f4'][Math.floor(Math.random() * 3)];
                this.size = Math.random() * 1.5 + 1;
                this.wingSpeed = (Math.random() * 0.01) + 0.005;
                this.wingOffset = Math.random() * Math.PI * 2;
            }

            update() {
                this.Vx = this.vx + getCx(this.x, this.y);
                this.Vy = this.vy + getCy(this.x, this.y);
                this.x += this.Vx;
                this.y += this.Vy;

                if (this.x < -50) this.x = width + 50;
                if (this.x > width + 50) this.x = -50;
                if (this.y < -50) this.y = height + 50;
                if (this.y > height + 50) this.y = -50;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(Math.atan2(this.Vy, this.Vx));

                const flap = Math.sin(Date.now() * this.wingSpeed + this.wingOffset) * 12;

                ctx.beginPath();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.size;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.moveTo(-10, flap);
                ctx.lineTo(0, 0);
                ctx.lineTo(-10, -flap);
                ctx.stroke();
                ctx.restore();
            }
        }

        for (let index = 0; index < 75; index += 1) {
            birds.push(new Bird());
        }

        if (!wm.classList.contains('hidden')) {
            centerWelcomeWindow();
        }
        dragElement(wm);

        function animateBirds() {
            ctx.clearRect(0, 0, width, height);

            birds.forEach((bird) => {
                bird.update();
                bird.draw();
            });

            requestAnimationFrame(animateBirds);
        }

        animateBirds();

        loginForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const username = loginUsername.value.trim();
            const password = loginPassword.value;

            if (username === 'robopugo' && password === 'Birb103!') {
                hideLogin();
                window.location.replace(osTarget);
            } else {
                showLoginError('Wrong username or password.');
            }
        });

        window.BirbOSGateway = {
            loginBypass,
            hideLogin,
            showLoginError,
        };
    </script>
</body>
</html>
